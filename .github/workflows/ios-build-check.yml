name: iOS build check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The real GoogleService-Info.plist is kept out of this public repo
      # (.gitignore), but the Xcode project lists it as a bundle resource, so
      # the build stops with "Build input file cannot be found" without one.
      # This placeholder only lets the compile check run; it is never shipped
      # (release builds are made locally with the real file).
      - name: Placeholder Firebase config
        run: |
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            cat > ios/Runner/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>ci-placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.mukaab.myambii</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key><string>ci-placeholder.appspot.com</string>
            <key>IS_GCM_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          PLIST
          fi

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

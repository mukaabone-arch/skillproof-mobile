name: myambii
description: Myambii candidate app
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  google_sign_in: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/myambii-logo.png
    - assets/icon/app_icon_dark_navy_1024.png

  # Bundled font assets — deliberately NOT the google_fonts package, whose
  # runtime fetch from fonts.gstatic.com crashed the app offline. Static
  # per-weight instances (not variable TTFs: Flutter's fontWeight matching
  # uses the declared weights below, it does not drive a variable wght axis).
  # Same 2-font system as web (apps/web globals.css): Space Grotesk for
  # display/headings, Inter for everything else.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# ---- flutter_launcher_icons ----
# image_path is the flat/legacy icon (used as-is for iOS and for Android's
# pre-adaptive-icon fallback). adaptive_icon_foreground is a separate,
# smaller-scale render of the same mark for Android's adaptive icon system;
# adaptive_icon_background is a flat colour, not an image, matching
# AppColors.background (lib/theme/app_colors.dart) so the two icon systems
# read as the same app. Both source PNGs were rendered on a slightly
# different navy (#0F1420) than AppColors.background (#161826) — see the
# splash config note below, same caveat applies here.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_dark_navy_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#161826"
  adaptive_icon_foreground: "assets/icon/app_icon_dark_navy_padded_1024.png"

# ---- flutter_native_splash ----
# color/background_color must equal AppColors.background (#161826) — this
# native (pre-Flutter-engine) splash has to hand off invisibly to
# lib/app.dart's _SplashScreen, which is painted on AppColors.background
# directly. NOTE: the source image itself was rendered on #0F1420, not
# #161826 — it's a fully opaque square with no transparent margin, so the
# navy baked into the PNG will show as a faint, slightly-darker square
# against this background_color rather than blending into it. Flagged for
# follow-up; not something this config can fix without a new source image.
flutter_native_splash:
  color: "#161826"
  image: assets/icon/app_icon_dark_navy_1024.png
  android_12:
    image: assets/icon/app_icon_dark_navy_1024.png
    color: "#161826"
  android: true
  ios: true
